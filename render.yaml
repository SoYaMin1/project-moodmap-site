databases:
  - name: moodmap-db
    databaseName: moodmap
    user: moodmap
    plan: free

services:
  - type: web
    name: moodmap
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn moodmap.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: moodmap-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # - key: CLOUDINARY_URL     # опционально
      #   sync: false