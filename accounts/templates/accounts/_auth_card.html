{% extends "diary/base.html" %}
{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="inline-flex items-center gap-2 mb-3">
        <span class="w-9 h-9 rounded-md bg-slate-900 flex items-center justify-center text-white text-sm font-bold">M</span>
        <span class="text-lg font-semibold text-slate-900">MoodMap</span>
      </div>
      <h1 class="text-2xl font-semibold text-slate-900">{% block heading %}{% endblock %}</h1>
      <p class="text-sm text-slate-500 mt-1.5">{% block subheading %}{% endblock %}</p>
    </div>

    <div class="rounded-xl bg-white border border-slate-200 p-6 shadow-sm">
      {% block form %}{% endblock %}
    </div>

    <p class="text-center text-sm text-slate-500 mt-6">
      {% block footer_link %}{% endblock %}
    </p>
  </div>
</div>
{% endblock %}
